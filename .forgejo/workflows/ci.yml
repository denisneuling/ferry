# Checks that run on every pull request, and on pushes to develop.
#
# Jobs run on the runner's default image rather than overriding `container:`,
# and install what they need: tool images like golang:1.27 ship no node, and
# `actions/checkout` needs one.
#
# The cheap checks gate the expensive ones:
#
#   secret-scan ─┐
#   lint ────────┴─> test ─> fuzz; ui, helm, release-notes `runs-on: docker` names a runner *label*, not an image.
name: ci

# A ref is built once. Branch work is built through its pull request; develop
# keeps a push trigger because it also receives direct pushes — the post-release
# sync in main.yml is one — and those reach no pull request.
on:
  push:
    branches: [develop]
  pull_request:

env:
  # The instance uses a private CA the runner may not carry.
  GIT_SSL_NO_VERIFY: "true"
  GO_VERSION: "1.27"
  NODE_VERSION: "24"
  # setup-go's own cache stays off in all three workflows: the runner points
  # GOPROXY at the in-cluster ci-cache already.

jobs:
  secret-scan:
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
      # The Makefile owns the version and the invocation. It scans the working
      # tree, not the history: `make secret-scan-history` is the audit.
      - name: Scan for committed credentials
        run: |
          M=""
          for t in curl tar make; do command -v $t >/dev/null || M="$M $t"; done
          [ -z "$M" ] || (apt-get update -qq && apt-get install -y -qq $M)
          make secret-scan

  lint:
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
      - uses: https://data.forgejo.org/actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # api/v1/v1.gen.go is committed: generated again with the oapi-codegen
      # go.mod pins as a tool, it must not change.
      - name: The generated API code is up to date
        run: |
          make generate-api
          git diff --exit-code -- api/v1 || { echo "api/v1 is out of date: run make generate-api and commit it"; exit 1; }
      # The spec is the contract the interface's client is generated from:
      # Redocly at the version the Makefile pins.
      - name: Lint the OpenAPI spec
        run: make lint-api
      # third_party/go-smb2 is upstream with PATCHES.md applied and nothing
      # else; its own tests of the patches run here, since ./... stops at
      # its go.mod.
      - name: The go-smb2 copy is upstream plus its patches
        run: make check-fork
      - name: Install golangci-lint at the pinned version
        run: |
          VERSION=$(grep '^GOLANGCI_LINT_VERSION' Makefile | cut -d= -f2 | tr -d ' ')
          echo "Installing golangci-lint $VERSION"
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "$VERSION"
      - run: $(go env GOPATH)/bin/golangci-lint run ./...

  # Unit tests, with the race detector.
  test:
    needs: [secret-scan, lint]
    runs-on: docker
    env:
      CGO_ENABLED: "1"
      # The test Samba this job starts (see the step below). Set here rather
      # than by the step, so that the SMB tests can never skip unnoticed: with
      # the addresses set and no Samba, they fail.
      FERRY_TEST_SMB_SERVER: 127.0.0.1:445
      FERRY_TEST_SMB_SERVER_BAD_PASSWORD: 127.0.0.1:446
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
      - uses: https://data.forgejo.org/actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # The race detector needs cgo, and cgo needs a C compiler the default
      # image may not carry.
      - name: Install a C compiler for the race detector
        run: command -v gcc >/dev/null || (apt-get update -qq && apt-get install -y -qq gcc libc6-dev)
      # The SMB tests run against a Samba this job starts itself, from the
      # distribution's package and hack/samba/setup.sh — the script the local
      # container runs too. No registry and no third-party image: the job runs
      # anywhere, also for contributors on the GitHub mirror.
      - name: Start the test Samba
        run: |
          set -eu
          # vfs_shadow_copy2, for the Versions share, is in samba-vfs-modules
          # on Debian and Ubuntu, not in samba itself.
          { command -v smbd >/dev/null && [ -e "$(smbd -b | sed -n 's/^ *MODULESDIR: //p')/vfs/shadow_copy2.so" ]; } \
            || (apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq samba samba-vfs-modules >/dev/null)
          sh hack/samba/setup.sh daemon
          for port in 445 446; do
            i=0
            until timeout 1 bash -c "</dev/tcp/127.0.0.1/$port" 2>/dev/null; do
              i=$((i + 1)); [ $i -lt 30 ] || { echo "Samba is not listening on $port"; exit 1; }; sleep 1
            done
          done
      - run: go test -race -count=1 ./...

  # Every fuzz target beyond its seeds, 45 seconds each. The parsers they
  # drive read uploaded files inside the process, outside any sandbox: the
  # HEIF boxes before the decoder, EXIF, audio covers, the image decoders.
  # A find fails the job, and hack/fuzz.sh prints the input to commit as a
  # seed. Without the race detector: it would slow the fuzzer several times.
  # After the tests, not beside them: the fuzzer takes all the CPU it gets,
  # and the timing of the Samba and race tests suffered for it on a shared
  # runner.
  fuzz:
    needs: [test]
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
      - uses: https://data.forgejo.org/actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: make fuzz FUZZTIME=45s

  # The interface is compiled into the binary, so an interface that does not
  # lint, test or build is a binary that cannot be released. Its API client
  # is generated from api/openapi/ferry-v1.yaml on each of these steps. Its
  # packages are all public: no token, no private CA.
  ui:
    needs: [secret-scan, lint]
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
      - uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: make ui-install
      - run: make ui-lint
      - name: The extracted texts are current, and every one is translated
        run: make ui-i18n
      - run: make ui-test
      - run: make ui-build

  helm:
    needs: [secret-scan, lint]
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
      - uses: https://data.forgejo.org/actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # get.helm.sh resets the connection from this runner, so both tools come
      # through the module proxy, which answers.
      - name: Install helm and helm-docs
        run: |
          set -eu
          HELM_DOCS=$(grep '^HELM_DOCS_VERSION' Makefile | cut -d= -f2 | tr -d ' ')
          go install helm.sh/helm/v3/cmd/helm@v3.16.3
          go install github.com/norwoodj/helm-docs/cmd/helm-docs@$HELM_DOCS
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint and render the chart
        run: make helm-lint
      - name: The chart README must be current
        run: |
          set -eu
          make helm-docs
          if ! git diff --exit-code -- charts/; then
            echo "ERROR: the chart README is out of date. Run: make helm-docs"
            exit 1
          fi

  # The changelog semantic-release writes lands on the public main: its links
  # must lead to GitHub, never to this forge (hack/release/check-notes.mjs).
  release-notes:
    needs: [secret-scan, lint]
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 200
      - uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Release notes link only to GitHub
        run: |
          set -eu
          mkdir -p /tmp/sr && cd /tmp/sr
          # The same packages as main.yml's release step.
          npm install --no-save --no-audit --no-fund \
            semantic-release@25 conventional-changelog-conventionalcommits@9
          cp "$GITHUB_WORKSPACE/hack/release/check-notes.mjs" .
          node check-notes.mjs "$GITHUB_WORKSPACE"
      # The release assets the workflows add beside the binaries, made the way
      # both make them: from the repository's root, into dist/ (GitHub; it is
      # not there beforehand for this script) and into . (Forgejo), each
      # checked with sha256sum. A release is the wrong time to find out.
      - name: The HEIF release assets build as the release workflows build them
        run: |
          set -eu
          rm -rf dist && mkdir dist
          hack/heif-asset.sh dist
          (cd dist && sha256sum ferry-heif.wasm ferry-heif-LICENSES.md > SHA256SUMS && sha256sum -c SHA256SUMS)
          hack/heif-asset.sh .
          sha256sum ferry-heif.wasm ferry-heif-LICENSES.md > SHA256SUMS.check && sha256sum -c SHA256SUMS.check
          cmp ferry-heif.wasm dist/ferry-heif.wasm
          hack/heif-asset.sh notes | grep -q "$(gunzip -c third_party/heif/heif.wasm.gz | sha256sum | cut -c1-64)"
          rm -rf dist ferry-heif.wasm ferry-heif-LICENSES.md SHA256SUMS.check
