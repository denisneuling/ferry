# Test configuration. `map to guest = Bad User` is deliberate: it is the
# setting under which a careless client turns an unknown user into a guest
# session, and ferry must refuse that.
[global]
  server role = standalone server
  workgroup = WORKGROUP
  server min protocol = SMB2_10
  map to guest = Bad User
  guest account = nobody
  security = user
  passdb backend = tdbsam
  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  log level = 1
  smb ports = 445

[alex]
  comment = Alex's files
  path = /srv/alex
  valid users = alex
  read only = no

[Family]
  comment = Shared by the family
  path = /srv/family
  valid users = @family
  read only = no
  force group = family
  create mask = 0664
  directory mask = 2775

[Public]
  comment = Anyone, guests too
  path = /srv/public
  guest ok = yes
  read only = no

[Scans]
  comment = The scanner drops files here
  path = /srv/scans
  valid users = alex sam
  read only = yes

[sam]
  comment = Sam's files
  path = /srv/sam
  valid users = sam
  read only = no

[hidden$]
  comment = Not listed
  path = /srv/hidden
  valid users = alex
