# The second test instance: the same users and shares as smb.conf, but with
# `map to guest = Bad Password`, under which Samba turns a wrong password for
# an existing user into a guest session. ferry must refuse that as well.
include = /etc/ferry-test-samba/smb.conf

# A second [global] section: Samba reads the file in order, so these settings
# override the included ones.
[global]
  map to guest = Bad Password
  smb ports = 446
  lock directory = /var/lib/ferry-test-samba/bad-password
  state directory = /var/lib/ferry-test-samba/bad-password
  cache directory = /var/lib/ferry-test-samba/bad-password
  pid directory = /run/ferry-test-samba/bad-password
