# The mock NAS: a household's Samba as ferry should expect to meet it, with
# the settings NAS distributions ship. Fictional users and shares; never a
# model for a real installation's security.
[global]
  server role = standalone server
  workgroup = WORKGROUP
  netbios name = MOCKNAS
  server string = Mock NAS
  security = user
  passdb backend = tdbsam
  # No guests: a wrong password is a wrong password.
  map to guest = never
  # What NAS distributions allow, old clients included; ferry speaks SMB2/3.
  server min protocol = LANMAN2
  server max protocol = SMB3_11
  nt pipe support = yes
  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  unix charset = UTF-8
  log level = 1
  # access based share enum, switched by MOCK_NAS_ACCESS_BASED_SHARE_ENUM
  # (entrypoint.sh writes this file).
  include = /etc/samba/mock-nas-abse.conf

[alex]
  comment = Alex's files
  path = /srv/alex
  valid users = alex
  read only = no

[sam]
  comment = Sam's files
  path = /srv/sam
  valid users = sam
  read only = no

[Family]
  comment = Shared by the household
  path = /srv/family
  valid users = @family
  read only = no
  force group = family
  create mask = 0664
  directory mask = 2775
  # Previous versions, as a ZFS NAS with sanoid offers them (snapshots.sh):
  # .zfs/snapshot hidden from listings as ZFS hides it, Fotos a nested
  # dataset with snapshots of its own.
  veto files = /.zfs/
  vfs objects = shadow_copy2
  shadow:snapdir = .zfs/snapshot
  shadow:snapdirseverywhere = yes
  shadow:crossmountpoints = yes
  shadow:snapprefix = ^autosnap
  shadow:delimiter = _
  shadow:format = _%Y-%m-%d_%H:%M:%S
  shadow:sort = desc

[Public]
  comment = Manuals and music, for everyone
  path = /srv/public
  read only = yes

[Scans]
  comment = The scanner drops files here
  path = /srv/scans
  valid users = @family
  read only = no
  force group = family
  create mask = 0664
  directory mask = 2775
