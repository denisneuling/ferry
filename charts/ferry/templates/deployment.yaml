{{- if not .Values.smb.server }}
{{- fail "smb.server is required: the SMB server ferry logs people in to, e.g. nas.example.lan or nas.example.lan:445" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ferry.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ferry.labels" . | nindent 4 }}
spec:
  # One replica, deliberately: sessions live in the process's memory, and a
  # second replica would not know them. A restart logs everyone out and loses
  # nothing else.
  replicas: 1
  {{- if .Values.cache.enabled }}
  # The cache's volume is ReadWriteOnce: the old pod lets go of it before
  # the new one starts. With one replica, a rolling update that adds none
  # and may take one away does exactly that. It stays a RollingUpdate on
  # purpose: switching a running release to Recreate leaves the API
  # server's rollingUpdate defaults behind under server-side apply, and the
  # API refuses them next to Recreate. Sessions die with the old pod either
  # way.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "ferry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ferry.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # ferry never talks to the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ferry
          image: {{ include "ferry.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [serve]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 8081
              protocol: TCP
          env:
            - name: FERRY_LISTEN
              value: ":8080"
            - name: FERRY_OPS_LISTEN
              value: ":8081"
            - name: FERRY_SMB_SERVER
              value: {{ .Values.smb.server | quote }}
            {{- with .Values.smb.serverName }}
            - name: FERRY_SERVER_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.smb.shares }}
            - name: FERRY_SHARES
              value: {{ join "," . | quote }}
            {{- end }}
            - name: FERRY_IDLE_TIMEOUT
              value: {{ .Values.session.idleTimeout | quote }}
            - name: FERRY_SESSION_LIFETIME
              value: {{ .Values.session.lifetime | quote }}
            - name: FERRY_SMB_CONNECTIONS
              value: {{ .Values.smb.connections | int | quote }}
            - name: FERRY_MAX_SESSIONS
              value: {{ .Values.session.maxSessions | quote }}
            - name: FERRY_LOGIN_RATE_ADDRESS
              value: {{ .Values.login.ratePerAddress | quote }}
            - name: FERRY_LOGIN_RATE_USER
              value: {{ .Values.login.ratePerUser | quote }}
            - name: FERRY_LOGIN_TIMEOUT
              value: {{ .Values.login.timeout | quote }}
            - name: FERRY_MAX_UPLOAD
              value: {{ .Values.limits.maxUpload | quote }}
            - name: FERRY_MAX_LISTING
              value: {{ .Values.limits.maxListing | int | quote }}
            - name: FERRY_MAX_DELETE
              value: {{ .Values.limits.maxDelete | int | quote }}
            - name: FERRY_MAX_ARCHIVE
              value: {{ .Values.limits.maxArchive | int | quote }}
            - name: FERRY_REQUEST_TIMEOUT
              value: {{ .Values.limits.requestTimeout | quote }}
            - name: FERRY_STALL_TIMEOUT
              value: {{ .Values.limits.stallTimeout | quote }}
            - name: FERRY_THUMBNAIL_MAX_BYTES
              value: {{ .Values.thumbnails.maxBytes | quote }}
            - name: FERRY_THUMBNAIL_MAX_PIXELS
              value: {{ .Values.thumbnails.maxPixels | int64 | quote }}
            - name: FERRY_THUMBNAIL_MEMORY
              value: {{ .Values.thumbnails.memory | quote }}
            - name: FERRY_THUMBNAIL_CONCURRENCY
              value: {{ .Values.thumbnails.concurrency | quote }}
            - name: FERRY_PREVIEW_PDF
              value: {{ .Values.previews.pdf | quote }}
            - name: FERRY_PREVIEW_HEIC
              value: {{ .Values.previews.heic | quote }}
            - name: FERRY_PREVIEW_HEIC_MEMORY
              value: {{ .Values.previews.heicMemory | quote }}
            - name: FERRY_PREVIEW_CONCURRENCY
              value: {{ .Values.previews.concurrency | int | quote }}
            {{- if .Values.cache.enabled }}
            - name: FERRY_CACHE_DIR
              value: /var/cache/ferry
            - name: FERRY_CACHE_MAX_BYTES
              value: {{ .Values.cache.maxBytes | quote }}
            - name: FERRY_CACHE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cache.existingSecret | default (printf "%s-cache" (include "ferry.fullname" .)) }}
                  key: key
            {{- end }}
            {{- with .Values.trustedProxies }}
            - name: FERRY_TRUSTED_PROXIES
              value: {{ join "," . | quote }}
            {{- end }}
            - name: FERRY_COOKIE_SECURE
              value: {{ .Values.cookieSecure | quote }}
            - name: FERRY_LOG_LEVEL
              value: {{ .Values.log.level | quote }}
            - name: FERRY_LOG_FORMAT
              value: {{ .Values.log.format | quote }}
            {{- with .Values.tracing.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.goMemLimit }}
            - name: GOMEMLIMIT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # /healthz is the process; /readyz whether the SMB server answers,
          # which takes ferry out of the Service without restarting it.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.cache.enabled }}
          volumeMounts:
            - name: cache
              mountPath: /var/cache/ferry
          {{- end }}
      {{- if .Values.cache.enabled }}
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: {{ .Values.cache.persistence.existingClaim | default (printf "%s-cache" (include "ferry.fullname" .)) }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
