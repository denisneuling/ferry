image:
  tag: "1.0.0"
smb:
  server: nas.example.lan:445
  serverName: The NAS
  shares: [alex, Family, Public]
  connections: 2
limits:
  maxUpload: 8Gi
trustedProxies: [198.51.100.0/24]
cookieSecure: "true"
tracing:
  otlpEndpoint: http://otel-collector.observability:4318
extraEnv:
  - name: TZ
    value: Europe/Berlin
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: files.example.com
      paths: [{ path: /, pathType: Prefix }]
  tls:
    - hosts: [files.example.com]
      secretName: files-tls
