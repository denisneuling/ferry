openapi: 3.0.3
info:
  title: ferry
  version: v1
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: |
    ferry shows SMB shares in a browser. This is the API its interface uses.

    **Login is an SMB session setup.** `POST /api/v1/login` connects to the
    configured SMB server and authenticates with exactly the credentials
    given. ferry keeps the live SMB session in memory under a random session
    cookie and forgets the password. Every other call acts on that session,
    as that user: the SMB server decides what is allowed, and ferry adds no
    rights and removes none.

    **Sessions** end after an idle timeout, after an absolute lifetime, on
    logout, when the SMB connection drops, or when ferry restarts. A call
    with an ended session is a `401` problem with code `unauthenticated`.

    **Cross-site requests.** Every request that changes something — login,
    logout, uploads, folders, moves, deletes — must carry the header
    `X-Ferry-Request: 1`. With the `SameSite=Strict` session cookie that is
    the CSRF protection.

    **Paths** are slash-separated and relative to the share's root; `/`, `.`
    and the empty path all mean the root. `..`, backslashes and NUL bytes
    are refused (`400`, `invalid_path`) before anything reaches the server.

    **Errors** are RFC 9457 problem details (`application/problem+json`)
    with a stable `code`. What the SMB server refuses is a problem, never an
    empty success: access denied is `403`, not found `404`, a name that
    exists or a file in use `409`, an unreachable server `502`.
servers:
  - url: /
tags:
  - name: session
    description: Login, logout and the current session.
  - name: files
    description: Shares, folders and files, as the logged-in user.
security:
  - SessionCookie: []

paths:
  # ── Session ────────────────────────────────────────────────────────────────
  /api/v1/info:
    get:
      operationId: getInfo
      tags: [session]
      summary: What the login page shows before anyone is logged in.
      security: []
      responses:
        "200":
          description: The server's display name and the session timeouts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }

  /api/v1/login:
    post:
      operationId: login
      tags: [session]
      summary: Log in with an SMB username and password.
      description: |
        Sets up an SMB session with exactly these credentials. On success the
        response sets the session cookie; the password is not kept. A login
        the server would only grant as a guest or anonymously is refused like
        a wrong password. Logins are rate limited per client address and per
        username.
      security: []
      parameters:
        - $ref: "#/components/parameters/FerryRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in. `Set-Cookie` carries the session.
          headers:
            Set-Cookie:
              description: The session cookie, `HttpOnly; SameSite=Strict; Path=/`, and `Secure` over HTTPS.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/logout:
    post:
      operationId: logout
      tags: [session]
      summary: End the session and its SMB session.
      description: |
        Idempotent; without a session it does nothing and still answers 204.
        The answer carries `Clear-Site-Data: "cache"`, so that thumbnails and
        details the browser keeps for a year go with the session.
      security: []
      parameters:
        - $ref: "#/components/parameters/FerryRequest"
      responses:
        "204":
          description: Logged out; the cookie is cleared.
          headers:
            Clear-Site-Data:
              description: '`"cache"`: the browser drops what it cached for this origin.'
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/me:
    get:
      operationId: getMe
      tags: [session]
      summary: The current session.
      responses:
        "200":
          description: Who is logged in, on which server, and until when.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── Files ──────────────────────────────────────────────────────────────────
  /api/v1/shares:
    get:
      operationId: listShares
      tags: [files]
      summary: The shares the server lists for this user.
      description: |
        The disk shares the SMB server enumerates on the user's session,
        without hidden (`$`) shares, narrowed by the deployment's allow-list
        if it has one. The server may list shares the user cannot open;
        opening one is then a `403`.
      responses:
        "200":
          description: The shares, sorted by name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/v1/shares/{share}/space:
    parameters:
      - $ref: "#/components/parameters/ShareName"
      - $ref: "#/components/parameters/EntryPath"
    get:
      operationId: getSpace
      tags: [files]
      summary: The size and free space of the volume a folder is on.
      description: |
        What the SMB server reports to this session for the folder
        (FileFsFullSizeInformation), and nothing ferry works out itself:
        `free` is what the server says this user may still write, which
        includes a quota when the server applies one. The answer has a short
        timeout of its own; the interface leaves the line out when it fails,
        and a folder opens regardless.
      responses:
        "200":
          description: The volume's size and free space.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Space" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/v1/shares/{share}/entries:
    parameters:
      - $ref: "#/components/parameters/ShareName"
      - $ref: "#/components/parameters/EntryPath"
    get:
      operationId: listEntries
      tags: [files]
      summary: The entries of a folder.
      parameters:
        - $ref: "#/components/parameters/At"
      description: |
        The entries come unsorted, in the order the server lists them, and
        are written out as they are read, a few hundred at a time: a large
        folder costs ferry no more memory than a small one.

        Ask for `application/x-ndjson` to read them as they arrive. Each line
        is one JSON object: an `Entry`, then a last line that is either
        `{"end": {"count": N}}` or `{"problem": Problem}` when the listing
        failed part-way. A stream without either last line was cut off and
        is incomplete. Errors before the first entry are ordinary problem
        responses.

        `application/json` is one `EntryList`. A listing that fails after
        it has begun ends the connection, so that a partial list never
        parses as a whole one.

        A folder with more entries than the deployment shows
        (`FERRY_MAX_LISTING`) is `too_large`, with `limit` set to that
        number.

        With `at`, the folder as the snapshot holds it (`At`).
      responses:
        "200":
          description: The folder's entries, unsorted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntryList" }
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/EntryStreamLine" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "502": { $ref: "#/components/responses/BadGateway" }
    delete:
      operationId: deleteEntry
      tags: [files]
      summary: Delete a file or a folder.
      description: |
        A folder is deleted only when it is empty, unless `recursive` is
        true; then its contents are deleted first, depth first. A recursive
        delete that fails part-way leaves what it had not reached yet.
      parameters:
        - $ref: "#/components/parameters/FerryRequest"
        - name: recursive
          in: query
          required: false
          description: Delete a folder with everything in it.
          schema: { type: boolean, default: false }
      responses:
        "204":
          description: Deleted.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/v1/shares/{share}/content:
    parameters:
      - $ref: "#/components/parameters/ShareName"
      - $ref: "#/components/parameters/EntryPath"
    get:
      operationId: getContent
      tags: [files]
      summary: Download a file, streamed, with Range.
      description: |
        Answers with the file's bytes. One byte range (`Range: bytes=a-b`) is
        honoured with `206`; several ranges are answered with the whole file.
        `ETag` and `Last-Modified` follow the file's size and modification
        time, so `If-None-Match` and `If-Range` work.

        The file never runs in ferry's origin: every answer carries
        `Content-Security-Policy: sandbox` and `X-Content-Type-Options:
        nosniff`. With `disposition=inline` the browser may show images,
        video, audio, PDF and plain text itself; anything else — HTML and SVG
        included — is sent as an attachment regardless.

        With `at`, the file as the snapshot holds it (`At`).
      parameters:
        - $ref: "#/components/parameters/At"
        - name: disposition
          in: query
          required: false
          schema:
            type: string
            enum: [attachment, inline]
            default: attachment
      responses:
        "200":
          description: The whole file.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: The requested range.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "304":
          description: Not modified since the `If-None-Match` ETag.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "416":
          description: The range lies outside the file.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/BadGateway" }
    put:
      operationId: putContent
      tags: [files]
      summary: Upload a file, streamed.
      description: |
        The body is written to a temporary name in the target folder and
        renamed to the file's name once it is complete, so a failed or
        interrupted upload never leaves a partial file under the real name.
        An existing file is replaced only with `overwrite=true`; otherwise
        it is a `409`. The deployment's upload limit applies (`413`).

        With `If-Match`, the file is replaced only while it is still the
        version that ETag names — an editor saving what it opened, as
        `getContent` gave it. A file that changed since, or is gone, is
        `412` (`changed`) and stays as it is; `overwrite` is then implied.
        The file is checked before the body is read and again just before
        the new one takes its place.
      parameters:
        - $ref: "#/components/parameters/FerryRequest"
        - name: If-Match
          in: header
          required: false
          description: The ETag `getContent` gave for the version being replaced.
          schema: { type: string, maxLength: 256 }
        - name: overwrite
          in: query
          required: false
          description: Replace a file of the same name.
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412":
          description: The file changed since the version `If-Match` names (`changed`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/v1/shares/{share}/metadata:
    get:
      operationId: getMetadata
      tags: [files]
      summary: What a file says about itself.
      description: |
        Read from the file's own bytes, by its content rather than its name:
        an image's size and camera (EXIF, HEIC included), a PDF's pages and
        title, a recording's length, codec and tags, a text's encoding and
        lines. Only a bounded part of the file is read — its start, and for
        formats that keep their index at the end, box headers and the tail —
        and nothing is logged; the result may be kept in the deployment's
        cache (`FERRY_CACHE_DIR`), given only once the file is open for
        reading under the requesting session. A format ferry does not read, or a
        file it cannot make sense of, is `kind: other` with whatever was
        found, not an error. Every value comes out of the file: show it as
        text. `ETag` follows the file; with `v`, see `FileVersion`.
      parameters:
        - $ref: "#/components/parameters/ShareName"
        - $ref: "#/components/parameters/EntryPath"
        - $ref: "#/components/parameters/FileVersion"
        - $ref: "#/components/parameters/At"
      responses:
        "200":
          description: What the file says.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileMetadata" }
        "304":
          description: Not modified since the `If-None-Match` ETag.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/v1/shares/{share}/thumbnail:
    get:
      operationId: getThumbnail
      tags: [files]
      summary: A thumbnail of an image or a recording's cover, made on the fly.
      description: |
        A JPEG of the image that fits in a `size`×`size` square, upright as
        its EXIF orientation says, never larger than the original. JPEG,
        PNG, GIF, WebP and BMP are read; of a recording — MP3 with an ID3v2
        tag, FLAC, MP4 and M4A, Ogg Vorbis and Opus — the cover it carries,
        the front cover when it says which; of a PDF, its first page, and of
        a HEIC photo, the photo — up to 320 from the thumbnail it carries —
        when the deployment makes those previews (`Info.previews`). Anything else,
        a recording without a cover included, is `415`. Made anew
        for every request, or taken from the deployment's cache once the file
        is open for reading under the requesting session; `ETag` follows the file, so the
        browser revalidates with `If-None-Match` and gets `304` while the
        file is unchanged; with `v`, see `FileVersion`. Images beyond the
        deployment's bounds — bytes or pixels — are `413`. A PDF page or a
        HEIC photo that takes longer than the deployment allows is `503`
        (`preview_timeout`): it may work when ferry is less busy.
      parameters:
        - $ref: "#/components/parameters/ShareName"
        - $ref: "#/components/parameters/EntryPath"
        - $ref: "#/components/parameters/FileVersion"
        - $ref: "#/components/parameters/At"
        - name: size
          in: query
          required: false
          description: The edge of the square the thumbnail fits in, in pixels.
          schema:
            type: integer
            enum: [160, 320, 640]
            default: 320
      responses:
        "200":
          description: The thumbnail.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "304":
          description: Not modified since the `If-None-Match` ETag.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415":
          description: Not an image, or a recording with a cover, ferry can make a thumbnail of (`not_an_image`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503":
          description: Making the preview took longer than the deployment allows (`preview_timeout`); try again later.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/shares/{share}/text:
    get:
      operationId: getDocumentText
      tags: [files]
      summary: The plain text of a Word or OpenDocument text.
      description: |
        The text of a `.docx` or an OpenDocument text (`.odt`), read out of
        its XML: paragraphs as lines, tabs as tabs, nothing else — no
        formatting, no pictures, no links, nothing of the document that
        could run. At most 512 KB, `truncated` when there is more. A file
        that is neither is `415` (`not_a_document`).
      parameters:
        - $ref: "#/components/parameters/ShareName"
        - $ref: "#/components/parameters/EntryPath"
        - $ref: "#/components/parameters/At"
      responses:
        "200":
          description: The text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentText" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415":
          description: Not a document ferry reads text from (`not_a_document`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/v1/shares/{share}/zip:
    get:
      operationId: listZip
      tags: [files]
      summary: What a ZIP archive holds.
      description: |
        The table of contents of a ZIP file, read from its central
        directory as it lies on the share: nothing is unpacked, nothing is
        written. Names are the archive's own, shown as text and never used
        as a path. An entry that is encrypted, or compressed otherwise than
        Store or Deflate, is listed with `readable: false`. More entries
        than the deployment lists (`FERRY_MAX_LISTING`) is `413`; a file
        that is no ZIP, `415` (`not_an_archive`).
      parameters:
        - $ref: "#/components/parameters/ShareName"
        - $ref: "#/components/parameters/EntryPath"
        - $ref: "#/components/parameters/At"
      responses:
        "200":
          description: The archive's entries, in its order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZipList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415":
          description: Not a ZIP archive (`not_an_archive`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/v1/shares/{share}/zip/entry:
    get:
      operationId: getZipEntry
      tags: [files]
      summary: One file out of a ZIP archive, unpacked as it is sent.
      description: |
        The entry named `entry`, exactly as `listZip` gave its name,
        unpacked while it streams and never more than its header declares
        (a stream that would be more is broken off). It is sent like a
        download: `attachment` with the entry's base name, cleaned; with
        `disposition=inline`, images, audio, video, PDF and plain text may
        show in the browser, under the same sandbox as `getContent`. An
        entry that cannot be read — encrypted, or another compression — is
        `415`.
      parameters:
        - $ref: "#/components/parameters/ShareName"
        - $ref: "#/components/parameters/EntryPath"
        - $ref: "#/components/parameters/At"
        - name: entry
          in: query
          required: true
          schema: { type: string, maxLength: 65535 }
        - name: disposition
          in: query
          required: false
          schema:
            type: string
            enum: [attachment, inline]
            default: attachment
      responses:
        "200":
          description: The entry's bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415":
          description: Not a ZIP archive, or an entry that cannot be read.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/v1/shares/{share}/versions:
    get:
      operationId: listVersions
      tags: [files]
      summary: The previous versions of a file or a folder.
      description: |
        What the server's snapshots hold of the path — Samba's
        `vfs_shadow_copy2`, Windows' shadow copies — newest first. Of a
        file, one entry for each state that differs from the one after it
        and from the file as it is now; of a folder, every snapshot that
        holds it, since its size and time say nothing of its contents. Each comes with the `at` that reads it
        (`At`). A path deleted since has versions all the same; a server or
        share without snapshots has none, which is no error.

        Looking costs one open on the share for each snapshot. When the
        answer takes longer than ferry allows, or the snapshots are more
        than it looks at, the newest found so far come with
        `truncated: true`.

        Only time and size are told: who changed a file is not.
      parameters:
        - $ref: "#/components/parameters/ShareName"
        - $ref: "#/components/parameters/EntryPath"
      responses:
        "200":
          description: The versions, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/v1/shares/{share}/search:
    get:
      operationId: search
      tags: [files]
      summary: Find names below a folder.
      description: |
        Looks for entries whose name contains `q` in the folder `path` and
        every folder below it, as they are now or, with `at`, as that
        snapshot holds them. Case is ignored, and names are compared after
        Unicode normalisation (NFC), so a name written decomposed matches.
        There is no index: the folders are listed one by one, breadth
        first, with the person's session, and nothing is kept. A folder the
        server refuses below `path` is skipped and counted; `path` refused
        is the error.

        The answer is `application/x-ndjson`, written as hits are found:
        one `{"hit": Entry}` per hit, then a last line, `{"end": …}` with
        what was looked through, or `{"problem": Problem}` when it failed
        part-way. A stream without either last line was cut off. Errors
        before the first line are ordinary problem responses.

        It stops after 1000 hits, 20000 folders, 32 levels below `path` or
        60 seconds, saying which in `end.reason` with `truncated: true`. A
        client that goes away stops it before the next folder.
      parameters:
        - $ref: "#/components/parameters/ShareName"
        - $ref: "#/components/parameters/EntryPath"
        - $ref: "#/components/parameters/At"
        - name: q
          in: query
          required: true
          description: What names must contain.
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        "200":
          description: The hits as they are found, and how the search ended.
          content:
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/SearchStreamLine" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/v1/shares/{share}/folders:
    post:
      operationId: createFolder
      tags: [files]
      summary: Create a folder.
      parameters:
        - $ref: "#/components/parameters/ShareName"
        - $ref: "#/components/parameters/EntryPath"
        - $ref: "#/components/parameters/FerryRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/v1/shares/{share}/archive:
    post:
      operationId: createArchive
      tags: [files]
      summary: Prepare a ZIP of files and folders, for downloading.
      description: |
        Lists the entries — files, and folders with everything in them — as
        the person's session sees them, and keeps the list under a ticket
        for `GET …/archive/{ticket}`, which a browser can download without
        headers of its own. What Samba refuses to list is the answer here,
        before anything is downloaded. All paths must be in the same folder;
        the archive holds them under their names in it. The ticket is valid
        once, for a minute, and only for this session.
      parameters:
        - $ref: "#/components/parameters/ShareName"
        - $ref: "#/components/parameters/FerryRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArchiveRequest" }
      responses:
        "201":
          description: Listed; download it with the ticket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArchiveTicket" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/v1/shares/{share}/archive/{ticket}:
    get:
      operationId: getArchive
      tags: [files]
      summary: Download a prepared ZIP.
      description: |
        The ZIP of what `POST …/archive` listed, written as it is read from
        the share: stored, not compressed — photos and videos do not shrink
        — with ZIP64 where it is large, names in UTF-8 and the files' times.
        Nothing is kept on ferry's side. Should a file fail once the archive
        has begun, the connection is closed: the browser reports a failed
        download, never a complete-looking archive with a file missing.
      parameters:
        - $ref: "#/components/parameters/ShareName"
        - name: ticket
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: The archive.
          headers:
            Content-Disposition:
              description: "`attachment`, with the archive's name."
              schema: { type: string }
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/shares/{share}/copy:
    post:
      operationId: copyEntry
      tags: [files]
      summary: Copy a file or a folder within a share, or restore a version as a copy.
      description: |
        Copies `from` to `to` — a folder with everything in it — as it is
        now or, with `at`, as that snapshot holds it: a previous version
        restored as a copy. The bytes go through ferry a chunk at a time,
        under the person's session, and each file is written to a
        temporary name and renamed once complete, so none is ever left
        half-copied under its real name.

        What would be copied is listed first: more than the deployment's
        entry bound (`FERRY_MAX_ARCHIVE`) or bytes bound (`FERRY_MAX_UPLOAD`,
        none by default) is `413`; a folder copied into itself is `400`
        (`copy_into_itself`); a target that exists is `409`, unless it is a
        file and `overwrite` is set. These come as ordinary problem
        responses, before anything is copied.

        Then the answer is `application/x-ndjson`: a `{"progress": …}`
        line about every second, so that a long copy is never a silent
        request, and a last line, `{"end": …}` with the new entry, or
        `{"problem": …}` with how far it got. A copy that fails or is
        abandoned part-way leaves the files copied so far in place; nothing
        is deleted to undo it. A client that goes away stops it between two
        chunks.
      parameters:
        - $ref: "#/components/parameters/ShareName"
        - $ref: "#/components/parameters/FerryRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CopyRequest" }
      responses:
        "200":
          description: The copy's progress, and how it ended.
          content:
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/CopyStreamLine" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/v1/shares/{share}/move:
    post:
      operationId: moveEntry
      tags: [files]
      summary: Rename or move a file or folder within a share.
      parameters:
        - $ref: "#/components/parameters/ShareName"
        - $ref: "#/components/parameters/FerryRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveRequest" }
      responses:
        "200":
          description: Moved; the entry under its new name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/BadGateway" }

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: ferry_session
      description: |
        The session cookie `POST /api/v1/login` sets. Served over HTTPS it is
        named `__Host-ferry_session`.

  parameters:
    ShareName:
      name: share
      in: path
      required: true
      description: The share's name, as the server lists it.
      schema: { type: string, minLength: 1, maxLength: 80 }
    EntryPath:
      name: path
      in: query
      required: false
      description: Slash-separated, relative to the share's root; empty for the root.
      schema: { type: string, maxLength: 4096, default: "" }
    FileVersion:
      name: v
      in: query
      required: false
      description: |
        The `version` of the entry as its listing gave it. When it is the
        file's version still, the answer is cached as
        `private, max-age=31536000, immutable`: a changed file has another
        version, and so another URL. When it is not — the file changed since
        the listing — the answer is the current file's, revalidated as
        without `v`. Never an error.
      schema: { type: string, maxLength: 64 }
    At:
      name: at
      in: query
      required: false
      description: |
        A snapshot's time as `listVersions` gives it, `@GMT-YYYY.MM.DD-HH.MM.SS`
        in UTC and exactly so: the path is read as that snapshot holds it,
        never written. Asked for under the person's own session, so the
        server decides as for the path now. A time that is no snapshot of
        the path is `404`; a request that would change something and
        carries `at` is `400` (`version_read_only`). A time is never part of
        the path.
      schema:
        type: string
        pattern: '^@GMT-[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{2}\.[0-9]{2}\.[0-9]{2}$'
        maxLength: 24
    FerryRequest:
      name: X-Ferry-Request
      in: header
      required: true
      description: Must be `1`. Together with the SameSite cookie, the CSRF protection.
      schema: { type: string, enum: ["1"] }

  responses:
    BadRequest:
      description: The request is not valid (`invalid_request`, `invalid_path`, `missing_ferry_request`, `version_read_only`, `copy_into_itself`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: No session (`unauthenticated`), or the server refused the credentials (`login_failed`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: The SMB server refused the operation (`access_denied`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such share, file or folder (`not_found`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: |
        The name exists (`exists`), the file is in use (`busy`), the folder is
        not empty (`not_empty`), or a file was named where a folder is needed
        or the other way round (`not_a_folder`, `is_a_folder`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooLarge:
      description: "A bound of ferry's own was reached (`too_large`): the upload limit, the entries of a folder shown, of a recursive delete or of a ZIP. `limit` says which number it was."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Too many logins from this address or for this username (`rate_limited`); `Retry-After` says when to try again.
      headers:
        Retry-After:
          description: Seconds until the next attempt may succeed.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadGateway:
      description: The SMB server cannot be reached or did not answer (`server_unreachable`), or the SMB connection was lost (`session_lost`, which also ends the session).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unavailable:
      description: ferry holds as many sessions as it is configured for (`too_many_sessions`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type: { type: string, description: "A URI identifying the problem type." }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: |
            Stable, machine-readable: `invalid_request`, `invalid_path`,
            `missing_ferry_request`, `version_read_only`, `copy_into_itself`, `unauthenticated`, `login_failed`,
            `rate_limited`, `access_denied`, `not_found`, `exists`, `busy`,
            `not_empty`, `not_a_folder`, `is_a_folder`, `too_large`,
            `range_not_satisfiable`, `changed`, `server_unreachable`, `session_lost`,
            `too_many_sessions`, `not_an_image`, `not_a_document`, `not_an_archive`, `preview_timeout`, `internal`.
        limit:
          type: integer
          format: int64
          description: |
            For `too_large`: the bound that was reached — entries for a
            listing or a recursive delete, bytes for an upload. Absent when
            the bound is not a number worth telling.

    Info:
      type: object
      required: [server, idleTimeoutSeconds, sessionLifetimeSeconds, version, limits]
      properties:
        server:
          type: string
          description: The SMB server's display name, for "with your account on …".
        idleTimeoutSeconds: { type: integer }
        sessionLifetimeSeconds: { type: integer }
        version: { type: string }
        limits: { $ref: "#/components/schemas/Limits" }
        previews:
          type: array
          description: |
            Formats beyond images and recordings this deployment makes
            thumbnails of (`pdf`, `heic`); the interface asks for those only.
          items: { type: string, enum: [pdf, heic] }
    Limits:
      type: object
      description: |
        The deployment's bounds, so that the interface can tell a person
        before they run into one.
      required: [listing, delete, upload, archive]
      properties:
        listing:
          type: integer
          description: Entries in one folder listing (`FERRY_MAX_LISTING`).
        delete:
          type: integer
          description: |
            Entries one delete removes (`FERRY_MAX_DELETE`): a recursive
            delete counts everything in the folder, and the interface holds a
            selection to the same number.
        upload:
          type: integer
          format: int64
          description: The largest upload in bytes (`FERRY_MAX_UPLOAD`); 0 for none.
        archive:
          type: integer
          description: |
            Entries in one ZIP download (`FERRY_MAX_ARCHIVE`), folders and
            everything in them counted; the interface holds a selection to
            it.

    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1, maxLength: 256 }
        password: { type: string, minLength: 1, maxLength: 1024, format: password }

    Me:
      type: object
      required: [username, server, expiresAt, idleTimeoutSeconds]
      properties:
        username: { type: string }
        server: { type: string, description: "The SMB server's display name." }
        expiresAt:
          type: string
          format: date-time
          description: When the session ends at the latest, regardless of activity.
        idleTimeoutSeconds: { type: integer }

    Share:
      type: object
      required: [name, comment]
      properties:
        name: { type: string }
        comment: { type: string, description: "The server's comment for the share; not translated." }
    ShareList:
      type: object
      required: [shares]
      properties:
        shares:
          type: array
          items: { $ref: "#/components/schemas/Share" }

    EntryType:
      type: string
      enum: [file, folder]
    Entry:
      type: object
      required: [name, path, type, size, modified, version]
      properties:
        name: { type: string }
        path: { type: string, description: "Slash-separated, relative to the share's root." }
        type: { $ref: "#/components/schemas/EntryType" }
        size: { type: integer, format: int64, description: "Bytes; 0 for folders." }
        modified: { type: string, format: date-time }
        version:
          type: string
          description: |
            Changes whenever the file's size or modification time does. Opaque:
            pass it as `v` to the thumbnail and the details, so that the
            browser keeps them until the file changes.
    Version:
      type: object
      required: [at, type, size, modified, version]
      properties:
        at:
          type: string
          description: The snapshot's time, to pass as `at`; UTC.
          example: "@GMT-2026.11.23-15.00.09"
        type: { $ref: "#/components/schemas/EntryType" }
        size: { type: integer, format: int64, description: "Bytes; 0 for folders." }
        modified: { type: string, format: date-time }
        version:
          type: string
          description: As `Entry.version`, for `v` together with `at`.
    ZipEntry:
      type: object
      required: [name, type, size, packed, readable]
      properties:
        name: { type: string, description: "The archive's own name for it: show it as text, never use it as a path." }
        type: { $ref: "#/components/schemas/EntryType" }
        size: { type: integer, format: int64, description: "Unpacked bytes, as the archive declares them." }
        packed: { type: integer, format: int64 }
        modified: { type: string, format: date-time }
        readable: { type: boolean, description: "Neither encrypted nor compressed otherwise than Store or Deflate." }
    ZipList:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/ZipEntry" }
    DocumentText:
      type: object
      required: [text, truncated]
      properties:
        text: { type: string, description: "Plain text: show it as text, never as markup." }
        truncated: { type: boolean }
    VersionList:
      type: object
      required: [versions, truncated]
      properties:
        versions:
          type: array
          items: { $ref: "#/components/schemas/Version" }
        truncated:
          type: boolean
          description: More snapshots than were looked at, in the time allowed or the bound.
    FileMetadata:
      type: object
      required: [kind]
      description: |
        What a file says about itself; a property is present only when the
        file says it. Strings are the file's own words, cleaned of control
        characters and cut at 200 characters.
      properties:
        kind: { type: string, enum: [image, video, audio, pdf, text, other] }
        format: { type: string, description: "e.g. JPEG, HEIC, MP4, FLAC, PDF 1.7." }
        width: { type: integer, description: "As shown: upright, after the EXIF orientation." }
        height: { type: integer, description: "As shown: upright, after the EXIF orientation." }
        taken: { type: string, description: "When the photo was taken, as the camera wrote it: ISO 8601, with a zone only when the camera gave one." }
        camera: { type: string }
        lens: { type: string }
        fNumber: { type: number, format: double, description: "The aperture: 2.8 for f/2.8." }
        exposure: { type: string, description: "The exposure time in seconds: 1/250, 0.5, 2." }
        iso: { type: integer }
        focalLength: { type: number, format: double, description: Millimetres. }
        orientation: { type: integer, minimum: 1, maximum: 8, description: The EXIF orientation. }
        location:
          type: object
          description: The photo's GPS position, as coordinates only.
          required: [latitude, longitude]
          properties:
            latitude: { type: number, format: double }
            longitude: { type: number, format: double }
        pages: { type: integer }
        title: { type: string }
        author: { type: string, description: "A PDF's author, a recording's artist." }
        album: { type: string }
        producer: { type: string, description: The program that made a PDF. }
        durationSeconds: { type: number, format: double }
        codec: { type: string }
        bitrate: { type: integer, description: Bits per second. }
        sampleRate: { type: integer }
        channels: { type: integer }
        encoding:
          type: string
          enum: [ascii, utf-8, utf-8-bom, utf-16le, utf-16be, 8bit]
          description: "How a text is encoded, as far as its bytes tell; `8bit` is not UTF-8 but some 8-bit code page, most likely Windows-1252 or ISO-8859-1."
        lines: { type: integer }
        linesAtLeast: { type: boolean, description: "The file is longer than the part counted: lines is a lower bound." }
        lineEndings: { type: string, enum: [LF, CRLF, CR, mixed] }
    Space:
      type: object
      required: [total, free]
      properties:
        total: { type: integer, format: int64, description: "The volume's size in bytes, as the server reports it." }
        free: { type: integer, format: int64, description: "Bytes this user may still write, as the server reports it." }
    EntryList:
      type: object
      required: [path, entries]
      properties:
        path: { type: string, description: "The folder, cleaned." }
        entries:
          type: array
          items: { $ref: "#/components/schemas/Entry" }
    EntryStreamLine:
      description: |
        One line of an `application/x-ndjson` listing: an entry, or the last
        line, which says how the listing ended.
      oneOf:
        - $ref: "#/components/schemas/Entry"
        - $ref: "#/components/schemas/EntryStreamEnd"
        - $ref: "#/components/schemas/EntryStreamProblem"
    SearchStreamLine:
      description: One line of a search's answer.
      oneOf:
        - $ref: "#/components/schemas/SearchHit"
        - $ref: "#/components/schemas/SearchEnd"
        - $ref: "#/components/schemas/EntryStreamProblem"
    SearchHit:
      type: object
      required: [hit]
      properties:
        hit: { $ref: "#/components/schemas/Entry" }
    SearchEnd:
      type: object
      required: [end]
      properties:
        end:
          type: object
          required: [hits, folders, skipped, truncated]
          properties:
            hits: { type: integer, description: "The hits given." }
            folders: { type: integer, description: "The folders looked through." }
            skipped: { type: integer, description: "Folders the server refused, or too large to look through." }
            truncated: { type: boolean, description: "It stopped at a bound before looking through everything." }
            reason:
              type: string
              enum: [hits, folders, depth, time]
              description: The bound it stopped at, when truncated.
    EntryStreamEnd:
      type: object
      required: [end]
      properties:
        end:
          type: object
          required: [count]
          properties:
            count: { type: integer, description: "The entries listed." }
    EntryStreamProblem:
      type: object
      required: [problem]
      properties:
        problem: { $ref: "#/components/schemas/Problem" }

    ArchiveRequest:
      type: object
      required: [paths]
      additionalProperties: false
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 10000
          items: { type: string, maxLength: 4096 }
          description: The entries to archive, all in the same folder.
    ArchiveTicket:
      type: object
      required: [ticket, name, entries, bytes]
      properties:
        ticket: { type: string, description: "For `GET …/archive/{ticket}`: once, within a minute, by this session." }
        name: { type: string, description: "The archive's file name, e.g. `Photos.zip`." }
        entries: { type: integer, description: "Files and folders in it." }
        bytes: { type: integer, format: int64, description: "The files' bytes together, before the archive's own." }
    CopyRequest:
      type: object
      required: [from, to]
      additionalProperties: false
      properties:
        from: { type: string, maxLength: 4096, description: "The entry's path." }
        to: { type: string, maxLength: 4096, description: "The copy's path, in the same share." }
        overwrite:
          type: boolean
          default: false
          description: Replace a file of the target name; a folder is never replaced.
        at:
          type: string
          maxLength: 24
          description: |
            Copy `from` as the snapshot of this time holds it (`At`): a
            previous version restored as a copy. Only the source is read at
            the snapshot; the copy is written into the share as it is now.
    CopyProgress:
      type: object
      required: [files, bytes, totalFiles, totalBytes]
      properties:
        files: { type: integer, description: "Entries made so far: files and folders." }
        bytes: { type: integer, format: int64, description: "Bytes copied so far." }
        totalFiles: { type: integer, description: "Entries the copy makes in all." }
        totalBytes: { type: integer, format: int64, description: "Bytes the copy copies in all." }
    CopyProgressLine:
      type: object
      required: [progress]
      properties:
        progress: { $ref: "#/components/schemas/CopyProgress" }
    CopyStreamLine:
      description: One line of a copy's answer.
      oneOf:
        - $ref: "#/components/schemas/CopyProgressLine"
        - $ref: "#/components/schemas/CopyEnd"
        - $ref: "#/components/schemas/CopyProblem"
    CopyEnd:
      type: object
      required: [end]
      properties:
        end:
          type: object
          required: [entry, progress]
          properties:
            entry: { $ref: "#/components/schemas/Entry" }
            progress: { $ref: "#/components/schemas/CopyProgress" }
    CopyProblem:
      type: object
      required: [problem, progress]
      properties:
        problem: { $ref: "#/components/schemas/Problem" }
        progress: { $ref: "#/components/schemas/CopyProgress" }
    MoveRequest:
      type: object
      required: [from, to]
      additionalProperties: false
      properties:
        from: { type: string, maxLength: 4096, description: "The entry's path." }
        to: { type: string, maxLength: 4096, description: "Its new path, in the same share." }
        overwrite:
          type: boolean
          default: false
          description: Replace a file of the target name.
